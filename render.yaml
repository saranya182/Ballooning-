services:
  - type: web
    name: pragmatic-ballooning
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: VITE_API_URL
        value: /api
      # Uncomment and add your MongoDB connection string when ready
      # - key: MONGODB_URI
      #   value: "mongodb+srv://..."
